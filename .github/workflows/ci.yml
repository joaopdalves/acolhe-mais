# Integração contínua do Acolhe+: a cada push e pull request,
# verifica a sintaxe, roda os testes de unidade e os de integração com MySQL 8.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      ACOLHE_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=acolhe_mais;charset=utf8mb4
      ACOLHE_DB_USER: root
      ACOLHE_DB_PASS: root

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring
          coverage: pcov

      - name: Dependências
        run: composer install --no-interaction --no-progress

      - name: Verificar sintaxe
        run: find src public templates tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Criar banco (estrutura + ajustes do MVP + dados de demonstração)
        run: |
          for f in database/01_schema.sql database/02_mvp.sql database/03_seed.sql; do
            mysql --default-character-set=utf8mb4 -h127.0.0.1 -uroot -proot < "$f"
          done

      - name: Testes de unidade (com cobertura)
        run: vendor/bin/phpunit --testsuite unidade --coverage-text

      - name: Testes de integração com MySQL
        run: vendor/bin/phpunit --testsuite integracao

  docker:
    # Confere que o docker compose sobe o sistema do zero e que o login funciona.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir MySQL e aplicação
        run: docker compose up -d --build

      - name: Aguardar e testar o login do coordenador
        run: |
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:8000/index.php?r=login && break; sleep 3; done
          T=$(curl -fs -c c.txt -b c.txt "http://localhost:8000/index.php?r=login" | grep -o 'name="csrf" value="[^"]*"' | sed 's/.*value="//;s/"//')
          curl -fs -c c.txt -b c.txt -o /dev/null --data-urlencode "csrf=$T" -d "email=gustavo@ongesperanca.org&senha=acolhe123" "http://localhost:8000/index.php?r=login"
          curl -fs -b c.txt "http://localhost:8000/index.php?r=painel" | tee painel.html | grep -q "Jailson Mendes"
          grep -q "ONG Esperança" painel.html && echo "Painel carregado com acentuação correta"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
